<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TANNETVISION — 内容后台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#08090a;color:#f4f4f1;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(720px,100%);border:1px solid #282b2f;background:#0d0f11;padding:52px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#858a90;text-transform:uppercase}.brand{font-size:28px;letter-spacing:.12em;margin:14px 0 34px}.panel h1{font-size:34px;font-weight:500;margin:0 0 14px}.panel p{color:#a5a8ac;line-height:1.8}.steps{margin:30px 0;padding:0;list-style:none;border-top:1px solid #282b2f}.steps li{padding:16px 0;border-bottom:1px solid #282b2f;color:#d9dbdd}.button{display:inline-flex;margin-top:28px;padding:13px 20px;border:1px solid #f4f4f1;color:#f4f4f1;text-decoration:none;font-size:12px;letter-spacing:.12em}.back{display:inline-block;margin-left:20px;color:#8b9095;text-decoration:none;font-size:12px}@media(max-width:600px){.panel{padding:30px 24px}.panel h1{font-size:28px}.back{display:block;margin:18px 0 0}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">TANNETVISION CMS</div>
    <div class="brand">TV / CONTENT</div>
    <h1>内容管理入口</h1>
    <p>免费方案使用 Pages CMS 托管后台。网站内容仍保存在你的 GitHub 仓库里，不需要数据库。</p>
    <ol class="steps">
      <li>使用 GitHub 登录 Pages CMS</li>
      <li>选择 TANNETVISION 网站仓库</li>
      <li>在“项目 / 经历 / 素材 / 联系方式”中编辑并保存</li>
      <li>GitHub 更新后，Cloudflare Pages 会自动重新发布网站</li>
    </ol>
    <a class="button" href="https://app.pagescms.org/" target="_blank" rel="noopener">打开 Pages CMS 后台 →</a>
    <a class="back" href="../index.html">返回网站</a>
  </main>
</body>
</html>
